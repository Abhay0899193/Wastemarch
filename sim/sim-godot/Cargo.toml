[package]
name = "sim-godot"
description = "GDExtension binding: the doorway from Godot into sim-core. Ships on the phone."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is what Godot loads at runtime; rlib keeps it usable from Rust tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core = { path = "../sim-core" }

# gdext, the Rust bindings for Godot.
#
# `api-custom` builds the bindings from the extension API of the Godot binary on
# this machine, rather than from a version baked into the crate. The crate's
# newest release predates Godot 4.7.1, so a baked-in level would be wrong; this
# way the bindings always match whatever Godot we actually run.
#
# It requires GODOT4_BIN to be set — see .cargo/config.toml.
godot = { version = "0.5", features = ["api-custom"] }
