; Export presets — committed on purpose.
;
; Godot's stock .gitignore excludes this file because it can hold signing paths.
; Ours is tracked because the mobile configuration below (arm64-only, min SDK 24,
; min iOS 15) is a Phase 0 deliverable and must not silently drift. Signing
; material is NOT here: keystores and identities come from environment variables,
; and *.keystore / *.jks / *.p12 / *.mobileprovision are gitignored.
;
; Only the options that matter are listed. Godot fills the rest from its defaults
; and will expand this file the first time the editor saves an export.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/bundle_identifier="com.wastemarch.game"
application/short_version="0.1.0"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=1
architectures/arm64=true
; A12 and newer, on Metal. Godot 4.5+ defaults to Metal for A12+.
; targeted_device_family=1 is iPhone only; add iPad in Phase 7 if we support it.

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

package/unique_name="com.wastemarch.game"
package/name="Wastemarch"
version/code=1
version/name="0.1.0"
; 64-bit only. MASTER_PLAN.md §4 drops 32-bit deliberately.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; min_sdk applies once the Gradle build template is installed, which needs the
; Android SDK. Set now so the intent survives; 24 is also the stock default.
gradle_build/use_gradle_build=false
gradle_build/min_sdk="24"
gradle_build/target_sdk="34"
screen/immersive_mode=true
