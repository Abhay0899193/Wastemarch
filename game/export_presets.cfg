; Export presets — committed on purpose.
;
; Godot's stock .gitignore excludes this file because it can hold signing paths.
; Ours is tracked because the mobile configuration below (arm64-only, min SDK 24,
; min iOS 15) is a Phase 0 deliverable and must not silently drift. Signing
; material is NOT here: keystores and identities come from environment variables,
; and *.keystore / *.jks / *.p12 / *.mobileprovision are gitignored.
;
; Only the options that matter are listed. Godot fills the rest from its defaults
; and will expand this file the first time the editor saves an export.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/bundle_identifier="com.wastemarch.game"
application/short_version="0.1.0"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=1
architectures/arm64=true
; A12 and newer, on Metal. Godot 4.5+ defaults to Metal for A12+.
; targeted_device_family=1 is iPhone only; add iPad in Phase 7 if we support it.

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

package/unique_name="com.wastemarch.game"
package/name="Wastemarch"
version/code=1
version/name="0.1.0"
; 64-bit only. MASTER_PLAN.md §4 drops 32-bit deliberately.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; min_sdk / target_sdk are deliberately NOT set here. Godot rejects the export
; outright if they are overridden while use_gradle_build is false:
;   "Min SDK" can only be overridden when "Use Gradle Build" is enabled.
; The prebuilt template's own values are used instead, and the produced APK is
; checked against MASTER_PLAN.md §4 (min SDK 24, arm64-v8a only) with
; `aapt2 dump badging`. If they ever drift, turn the Gradle build on and set them
; there — do not re-add them here.
gradle_build/use_gradle_build=false
screen/immersive_mode=true

[preset.2]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

; Steam macOS/Windows is the secondary platform in MASTER_PLAN.md, so this preset
; is in scope eventually. Right now its job is diagnostic: it exercises the whole
; export chain with no signing involved, which separates "the project exports" from
; "signing is configured" when an iOS export fails.
application/bundle_identifier="com.wastemarch.game"
application/short_version="0.1.0"
application/version="1"
; The macOS template ships one universal binary (godot_macos_debug.universal),
; not per-architecture ones — asking for "arm64" fails with a missing-template
; error that reads like the template is absent when it is not.
binary_format/architecture="universal"
codesign/codesign=0
notarization/notarization=0
