name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  sim:
    # The matrix IS the determinism test. sim-core carries a golden hash of a
    # reference workload; if x86_64 Linux and arm64 macOS ever compute different
    # numbers for it, one of these two jobs goes red and the other stays green.
    # That is the failure the whole architecture is built to make impossible, so
    # it must be impossible to merge past.
    #
    # Phase 1 adds an arm64 Linux runner and an on-device run to close the gate.
    name: Simulation core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # always want both results, never just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # no binary assets are needed to build or test the sim

      # Runs first, before anything is compiled. A float in sim-core is not a
      # code-quality nit to fix later, it is a correctness failure that
      # invalidates every other result in this job.
      - name: No floating-point in sim-core
        run: sh ci/no-floats.sh

      # No setup-rust step on purpose. sim/rust-toolchain.toml pins 1.95.0 with
      # rustfmt and clippy, and rustup installs it on the first cargo command.
      # One source of truth for the version beats two that can drift apart.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim
          key: ${{ matrix.os }}

      - name: Toolchain
        working-directory: sim
        run: cargo --version && rustc --version

      - name: Formatting
        working-directory: sim
        run: cargo fmt --all -- --check

      # sim-godot is excluded here and checked in its own job below. It needs the
      # Godot binary at build time (gdext's api-custom generates bindings from the
      # engine itself), and downloading Godot onto both legs of this matrix would
      # double its cost for no gain — this job exists to compare arithmetic across
      # platforms, and sim-godot contains none.
      - name: Clippy
        working-directory: sim
        run: cargo clippy --workspace --exclude sim-godot --all-targets -- -D warnings

      - name: Tests
        working-directory: sim
        run: cargo test --workspace --exclude sim-godot

      # MASTER_PLAN.md §9 wants 10,000 seeded runs. The sweep itself is only ~6s
      # in release (~157s in debug, where overflow checks dominate) — the real
      # cost is the extra release build, which is why this runs on ubuntu only.
      # GitHub bills macOS runners at ten times the rate, and the cross-platform
      # question is already settled by the golden hash that both legs check.
      - name: Full 10,000-seed sweep
        if: matrix.os == 'ubuntu-latest'
        working-directory: sim
        run: cargo test -p sim-core --release -- --ignored --nocapture

  sim-godot:
    # The GDExtension binding. Checked once, on Linux — it is the same source
    # everywhere and this only needs to catch "does it still compile against the
    # engine", not platform differences.
    #
    # This job exists because its absence let a real breakage through: adding
    # gdext made the `sim` job fail on both platforms at once, which is the
    # signature of a build problem rather than the cross-platform divergence that
    # job is meant to detect. Keeping them separate keeps that signal clean.
    name: GDExtension binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "${base}/${GODOT_VERSION}-stable/${file}.zip"
          unzip -q godot.zip
          sudo install -m 755 "${file}" /usr/local/bin/godot
          godot --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim
          key: sim-godot

      # sim/.cargo/config.toml hard-codes a local macOS path for GODOT4_BIN.
      # Cargo's [env] does not override a variable already present in the
      # environment unless it sets force = true, so this wins here.
      - name: Build and lint the binding
        working-directory: sim
        env:
          GODOT4_BIN: /usr/local/bin/godot
        run: |
          cargo clippy -p sim-godot --all-targets -- -D warnings
          cargo build -p sim-godot

  godot:
    name: Godot project imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the project references assets, so they must be real files

      # Cheap, and it guards the project's one *critical* risk: art that drifts.
      # Fails if two colours with different meanings become confusable, including
      # under simulated colour blindness, or if ART_BIBLE.md and the script
      # disagree about a value. Stdlib only, so no setup step.
      - name: Colour palette separation and colourblind safety
        run: python3 tools/art/palette_check.py

      - name: Fetch Godot ${{ env.GODOT_VERSION }} headless
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "${base}/${GODOT_VERSION}-stable/${file}.zip"
          unzip -q godot.zip
          sudo install -m 755 "${file}" /usr/local/bin/godot
          godot --version

      # Catches broken scene references, missing files and corrupt resources now,
      # rather than the next time someone opens the editor.
      - name: Import and run the project
        run: |
          set -euo pipefail
          godot --headless --path game --quit           2>&1 | tee import.log
          godot --headless --path game --quit-after 5   2>&1 | tee -a import.log
          if grep -qE "(ERROR|SCRIPT ERROR):" import.log; then
            echo "::error::Godot reported errors during import"
            grep -nE "(ERROR|SCRIPT ERROR):" import.log
            exit 1
          fi

  ios:
    name: iOS build
    # Manual only, and a stub. A real iOS build needs signing certificates, which
    # cannot be held safely on a GitHub-hosted runner — this moves to a
    # self-hosted macOS runner at the end of Phase 0. Running it on every push
    # would only burn minutes failing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Not yet implemented
        run: |
          echo "::warning::iOS export is not wired up yet."
          echo "Blocked on: export templates (ios.zip absent locally),"
          echo "            signing certificates, and a self-hosted macOS runner."
          echo "Tracked in .agent/PLAN.md under 'Remaining Phase 0 work'."
